<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Les Geoffroy-Lafond</title>
<style>
:root{
  --fond:#f6f1e7; --papier:#fffdf8; --encre:#2b2420; --doux:#6f6359; --trait:#d9cdbb;
  --accent:#7a4a2a; --accent-doux:#efe2d0; --f:#a0526a; --m:#3f6b8c; --focus:#fff4e2;
  --ombre:0 1px 2px rgba(60,40,20,.08),0 2px 8px rgba(60,40,20,.06);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{--fond:#1c1915;--papier:#262119;--encre:#efe6d8;--doux:#b3a593;--trait:#463d32;
    --accent:#e0a878;--accent-doux:#3a2f24;--f:#e08aa3;--m:#86b3d6;--focus:#3b3023;
    --ombre:0 1px 2px rgba(0,0,0,.3),0 2px 8px rgba(0,0,0,.25);}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fond);color:var(--encre);font-family:var(--sans);font-size:15px;line-height:1.45}
a{color:var(--accent)}
button,input{font:inherit;color:inherit}
.prive-banniere{background:#7a2a2a;color:#fff;text-align:center;font-size:12px;padding:4px 8px;letter-spacing:.02em}
header{background:var(--papier);border-bottom:1px solid var(--trait);position:sticky;top:0;z-index:20}
.entete{max-width:1200px;margin:0 auto;padding:12px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
h1{font-family:var(--serif);font-weight:600;font-size:24px;margin:0;letter-spacing:.01em;cursor:pointer;white-space:nowrap}
h1 small{display:block;font-family:var(--sans);font-size:12px;font-weight:400;color:var(--doux);letter-spacing:0}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{border:1px solid transparent;background:none;padding:6px 12px;border-radius:999px;cursor:pointer;color:var(--doux)}
nav button:hover{background:var(--accent-doux);color:var(--encre)}
nav button[aria-current="true"]{background:var(--accent);color:var(--papier)}
.recherche{position:relative;margin-left:auto;flex:1 1 220px;max-width:340px}
.recherche input{width:100%;padding:8px 12px;border:1px solid var(--trait);border-radius:999px;background:var(--fond)}
.recherche input:focus{outline:2px solid var(--accent);outline-offset:1px}
.resultats{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--papier);border:1px solid var(--trait);border-radius:10px;box-shadow:var(--ombre);max-height:60vh;overflow:auto;display:none}
.resultats.ouvert{display:block}
.resultats button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 12px;cursor:pointer}
.resultats button:hover,.resultats button.actif{background:var(--accent-doux)}
.resultats .an{color:var(--doux);font-size:12px;margin-left:6px}
main{max-width:1200px;margin:0 auto;padding:20px 16px 48px}
.grille{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;align-items:start}
@media (max-width:900px){.grille{grid-template-columns:1fr}}
.rangee{margin:0 0 6px}
.rangee h3{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--doux);font-weight:600;margin:0 0 6px;text-align:center}
.groupes{display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
.groupe{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;position:relative}
.groupe-etiquette{width:100%;text-align:center;font-size:11px;color:var(--doux)}
.connecteur{height:22px;display:flex;justify-content:center}
.connecteur::before{content:"";width:1px;background:var(--trait)}
.carte{background:var(--papier);border:1px solid var(--trait);border-left:4px solid var(--trait);border-radius:8px;padding:8px 12px;min-width:150px;max-width:220px;cursor:pointer;box-shadow:var(--ombre);text-align:left;transition:transform .12s, border-color .12s}
.carte:hover{transform:translateY(-1px);border-color:var(--accent)}
.carte:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.carte.F{border-left-color:var(--f)} .carte.M{border-left-color:var(--m)}
.carte .prenom{font-weight:600;display:block}
.carte .nom{font-family:var(--serif);display:block}
.carte .dates{display:block;font-size:12px;color:var(--doux);margin-top:2px}
.carte.masque{cursor:default;border-style:dashed;border-left-width:1px;color:var(--doux);font-style:italic;box-shadow:none;background:transparent}
.carte.masque:hover{transform:none;border-color:var(--trait)}
.carte.vide{cursor:default;border-style:dashed;border-left-width:1px;color:var(--doux);box-shadow:none;background:transparent;font-size:13px}
.carte.vide:hover{transform:none;border-color:var(--trait)}
.carte.centre{background:var(--focus);border-color:var(--accent);min-width:200px;padding:12px 16px}
.carte.centre .nom{font-size:20px}
.centre-rang{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap}
.union{font-size:12px;color:var(--doux);text-align:center;padding:0 4px}
.union b{display:block;font-size:18px;color:var(--accent);font-family:var(--serif)}
.panneau{background:var(--papier);border:1px solid var(--trait);border-radius:12px;padding:18px;box-shadow:var(--ombre);position:sticky;top:90px}
@media (max-width:900px){.panneau{position:static}}
.panneau h2{font-family:var(--serif);font-size:22px;margin:0 0 2px;font-weight:600}
.panneau .sous{color:var(--doux);margin:0 0 14px;font-size:13px}
.panneau dl{margin:0;font-size:14px}
.panneau dt{color:var(--doux);font-size:12px;margin-top:10px}
.panneau dt:first-child{margin-top:0}
.panneau dd{margin:0}
.panneau h4{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--doux);margin:16px 0 6px}
.panneau ul{margin:0;padding-left:18px}
.puce{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--accent-doux);margin:0 4px 4px 0}
.lienp{background:var(--accent-doux);border-radius:8px;padding:8px 10px;font-size:14px;margin-top:10px}
.medias{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.medias a{display:block;font-size:11px;color:var(--doux);text-decoration:none}
.medias img{width:100%;aspect-ratio:3/4;object-fit:cover;border:1px solid var(--trait);border-radius:4px;background:#fff}
.lien-nom{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.btn{border:1px solid var(--trait);background:var(--papier);padding:6px 12px;border-radius:8px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
/* Ascendance */
.asc-outils{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap;color:var(--doux);font-size:13px}
.asc-cadre{overflow:auto;background:var(--papier);border:1px solid var(--trait);border-radius:12px;padding:12px}
.asc{position:relative}
.asc svg{position:absolute;inset:0;pointer-events:none}
.asc .carte{display:flex;flex-direction:column;justify-content:center;overflow:hidden;line-height:1.25}
.asc .carte .prenom,.asc .carte .nom{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.asc .carte .dates{font-size:11px;margin-top:1px}
.asc .compact .prenom,.asc .compact .nom{display:inline}
.asc .compact .nom::before{content:" "}
.asc .compact{display:block;padding-top:6px!important}
.asc .compact .dates{display:block}
/* Lien */
.lien-form{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:end;background:var(--papier);border:1px solid var(--trait);border-radius:12px;padding:16px}
@media (max-width:640px){.lien-form{grid-template-columns:1fr}}
.lien-form label{font-size:12px;color:var(--doux);display:block;margin-bottom:4px}
.lien-form .recherche{max-width:none;margin:0}
.lien-res{margin-top:18px}
.lien-phrase{font-family:var(--serif);font-size:22px;text-align:center;margin:10px 0 18px}
.chemins{display:flex;justify-content:center;gap:28px;flex-wrap:wrap}
.chemin{display:flex;flex-direction:column;align-items:center;gap:0}
.chemin .connecteur{height:16px}
.sommet{display:flex;flex-direction:column;align-items:center;margin-bottom:0}
/* Index */
.idx-outils{display:flex;gap:12px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.idx-outils input{padding:8px 12px;border:1px solid var(--trait);border-radius:8px;background:var(--papier);min-width:240px}
.idx{columns:3 260px;column-gap:28px}
.idx section{break-inside:avoid;margin-bottom:16px}
.idx h3{font-family:var(--serif);font-size:18px;margin:0 0 4px;border-bottom:1px solid var(--trait);padding-bottom:2px}
.idx h3 small{color:var(--doux);font-family:var(--sans);font-size:12px;font-weight:400}
.idx button{display:block;background:none;border:0;padding:2px 0;cursor:pointer;text-align:left;width:100%}
.idx button:hover{color:var(--accent)}
.idx .an{color:var(--doux);font-size:12px}
.note{color:var(--doux);font-size:13px}
footer{max-width:1200px;margin:0 auto;padding:0 16px 32px;color:var(--doux);font-size:12px;text-align:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div id="banniere"></div>
<header>
  <div class="entete">
    <h1 id="titre" tabindex="0"><span id="titre-txt"></span><small id="sous-titre"></small></h1>
    <nav id="nav" aria-label="Vues">
      <button data-vue="famille">Famille</button>
      <button data-vue="ascendance">Ascendance</button>
      <button data-vue="lien">Lien de parenté</button>
      <button data-vue="index">Index</button>
    </nav>
    <div class="recherche" id="recherche-entete"></div>
  </div>
</header>
<main id="contenu"></main>
<footer id="pied"></footer>

    const x = file.shift();
    for (const p of parentsDe[x]) if (!(p in dist)) { dist[p] = dist[x]+1; prec[p] = x; file.push(p); }
  }
  return {dist, prec};
}
const ord = n => n === 1 ? "1er" : n + "e";
function nomLien(a, b, f, demi){
  const g = (m, fe) => f ? fe : m;
  if (a === 0 && b === 0) return "la même personne";
  if (b === 0) return ({1:g("père","mère"),2:g("grand-père","grand-mère"),3:g("arrière-grand-père","arrière-grand-mère"),4:g("arrière-arrière-grand-père","arrière-arrière-grand-mère")})[a] || `ancêtre à la ${ord(a)} génération`;
  if (a === 0) return ({1:g("fils","fille"),2:g("petit-fils","petite-fille"),3:g("arrière-petit-fils","arrière-petite-fille")})[b] || `descendant${f?"e":""} à la ${ord(b)} génération`;
  if (a === 1 && b === 1) return (demi ? "demi-" : "") + g("frère","sœur");
  if (a === 1) return ({2:g("neveu","nièce"),3:g("petit-neveu","petite-nièce")})[b] || "arrière-".repeat(b-3) + g("petit-neveu","petite-nièce");
  if (b === 1) return ({2:g("oncle","tante"),3:g("grand-oncle","grand-tante")})[a] || "arrière-".repeat(a-3) + g("grand-oncle","grand-tante");
  const deg = Math.min(a,b) - 1, cousin = g("cousin","cousine");
  const base = deg === 1 ? `${cousin} ${g("germain","germaine")}` : deg === 2 ? `${cousin} ${g("issu","issue")} de germain` : `${cousin} au ${ord(deg)} degré`;
  const ecart = b - a;
  if (!ecart) return base;
  const neutre = ({1:"cousin(e) germain(e)",2:"cousin(e) issu(e) de germain"})[deg] || `cousin(e) au ${ord(deg)} degré`;
  if (ecart > 0) return `${({1:g("fils","fille"),2:g("petit-fils","petite-fille")})[ecart] || g("descendant","descendante")} d'un(e) ${neutre}`;
  return `${base} ${({1:"d'un parent",2:"d'un grand-parent"})[-ecart] || "d'un ancêtre"}`;
}
function article(n, f){
  if (n.startsWith("la même")) return n;
  if (/^[aeiouéèêàâîôûAEIOU]/.test(n)) return "l'" + n;
  return (f ? "la " : "le ") + n;
}
function lienSang(A, B){
  const da = ancetres(A), db = ancetres(B);
  let best = Infinity, ancs = [];
  for (const x in da.dist) if (x in db.dist){
    const s = da.dist[x] + db.dist[x];
    if (s < best){ best = s; ancs = [x]; } else if (s === best) ancs.push(x);
  }
  if (!ancs.length) return null;
  const a = da.dist[ancs[0]], b = db.dist[ancs[0]];
  ancs = ancs.filter(x => da.dist[x] === a && db.dist[x] === b);
  const chemin = (prec, x) => { const c = []; while (x){ c.push(x); x = prec[x]; } return c; }; // ancêtre → personne
  return {texte: nomLien(a, b, fem(B), a===1 && b===1 && ancs.length===1), ancs, a, b,
          cheminA: chemin(da.prec, ancs[0]), cheminB: chemin(db.prec, ancs[0])};
}
function lien(A, B){
  const r = lienSang(A, B);
  if (r) return {phrase: `${nom(B)} est ${article(r.texte, fem(B))} de ${nom(A)}.`, sang: r};
  for (const c of conjointsDe(B)){
    if (c === A) return {phrase: `${nom(B)} est ${fem(B) ? "la conjointe" : "le conjoint"} de ${nom(A)}.`};
    const s = lienSang(A, c);
    if (s) return {phrase: `${nom(B)} est conjoint(e) de ${nom(c)}, qui est ${article(s.texte, fem(c))} de ${nom(A)}.`, sang: s, par: c};
  }
  for (const c of conjointsDe(A)){
    const s = lienSang(c, B);
    if (s) return {phrase: `${nom(B)} est ${article(s.texte, fem(B))} de ${nom(c)}, conjoint(e) de ${nom(A)}.`, sang: s};
  }
  return {phrase: `Aucun lien trouvé entre ${nom(A)} et ${nom(B)} dans l'arbre.`};
}

/* ---------- état / routage ---------- */
let vue = "famille", focus = DEPART, lienA = DEPART, lienB = null, nbGen = 5;
function lireHash(){
  const [, v, id, id2] = location.hash.split("/");
  if (["famille","ascendance","lien","index"].includes(v)) vue = v;
  if (id && P[id] && !masque(id)) { if (vue === "lien") lienA = id; else focus = id; }
  if (vue === "lien" && id2 && P[id2] && !masque(id2)) lienB = id2;
}
function aller(v, id, id2){
  const h = "#/" + v + (id ? "/" + id : "") + (id2 ? "/" + id2 : "");
  if (location.hash !== h) location.hash = h; else rendre();
}
window.addEventListener("hashchange", () => { lireHash(); rendre(); window.scrollTo({top:0}); });

/* ---------- composants ---------- */
function carte(k, cls=""){
  if (!k) return `<div class="carte vide ${cls}">Inconnu</div>`;
  if (masque(k)) return `<div class="carte masque ${cls}" title="Nom masqué : personne mineure">Personne mineure</div>`;
  const p = P[k], d = annees(k);
  return `<button class="carte ${p.sexe||""} ${cls}" data-id="${k}" title="${esc(nom(k))}">
    <span class="prenom">${esc(p.prenom||"")}</span><span class="nom">${esc(p.nom||"")}</span>${d ? `<span class="dates">${esc(d)}</span>` : ""}</button>`;
}
function champRecherche(id, placeholder, surChoix, valeur){
  const el = document.getElementById(id);
  el.innerHTML = `<input type="search" placeholder="${esc(placeholder)}" aria-label="${esc(placeholder)}" autocomplete="off" value="${esc(valeur||"")}"><div class="resultats" role="listbox"></div>`;
  const inp = el.querySelector("input"), res = el.querySelector(".resultats");
  let liste = [], actif = 0;
  const tous = Object.keys(P).filter(k => !masque(k)).map(k => [k, norm(nom(k))]);
  function maj(){
    const q = norm(inp.value).trim().split(/\s+/).filter(Boolean);
    if (!q.length){ res.classList.remove("ouvert"); return; }
    liste = tous.filter(([,n]) => q.every(t => n.includes(t))).slice(0, 12).map(([k]) => k);
    actif = 0;
    res.innerHTML = liste.length ? liste.map((k,i) => `<button data-id="${k}" class="${i===0?"actif":""}">${esc(nom(k))}<span class="an">${esc(annees(k))}</span></button>`).join("")
                                 : `<div class="note" style="padding:8px 12px">Aucun résultat</div>`;
    res.classList.add("ouvert");
  }
  inp.addEventListener("input", maj);
  inp.addEventListener("focus", () => { if (inp.value && valeur !== inp.value) maj(); });
  inp.addEventListener("keydown", e => {
    if (e.key === "ArrowDown" || e.key === "ArrowUp"){
      e.preventDefault(); actif = (actif + (e.key === "ArrowDown" ? 1 : -1) + liste.length) % Math.max(liste.length,1);
      res.querySelectorAll("button").forEach((b,i) => b.classList.toggle("actif", i === actif));
    } else if (e.key === "Enter" && liste[actif]){ choisir(liste[actif]); }
    else if (e.key === "Escape"){ res.classList.remove("ouvert"); }
  });
  res.addEventListener("mousedown", e => { const b = e.target.closest("button[data-id]"); if (b){ e.preventDefault(); choisir(b.dataset.id); } });
  inp.addEventListener("blur", () => setTimeout(() => res.classList.remove("ouvert"), 150));
  function choisir(k){ res.classList.remove("ouvert"); inp.blur(); surChoix(k, inp); }
}

/* ---------- vue Famille ---------- */
function vueFamille(){
  const k = focus, par = parentsDe[k];
  const pere = par.find(x => P[x].sexe === "M") || null, mere = par.find(x => P[x].sexe === "F") || null;
  const ordonnes = (pere || mere) ? [pere, mere] : [];
  let h = `<div class="grille"><div>`;
  // grands-parents
  const gp = ordonnes.map(x => x ? parentsDe[x] : []);
  if (gp.some(g => g.length)){
    h += `<div class="rangee"><h3>Grands-parents</h3><div class="groupes">` + ordonnes.map((x,i) => {
      const g = gp[i]; const gpe = g.find(y => P[y].sexe==="M"), gme = g.find(y => P[y].sexe==="F");
      return `<div class="groupe"><div class="groupe-etiquette">${i===0 ? "côté paternel" : "côté maternel"}</div>${carte(gpe)}${carte(gme)}</div>`;
    }).join("") + `</div></div><div class="connecteur"></div>`;
  }
  if (ordonnes.length){
    h += `<div class="rangee"><h3>Parents</h3><div class="groupes"><div class="groupe">${carte(pere)}${carte(mere)}</div></div></div><div class="connecteur"></div>`;
  }
  // centre
  const cj = unions[k];
  h += `<div class="rangee"><div class="centre-rang">${carte(k, "centre")}` + cj.map(fid => {
    const f = F[fid], autre = (f.parents||[]).find(x => x !== k);
    if (!autre) return "";
    const mar = PRIVE && f.mariage && f.mariage.date ? `<span>${esc(an(f.mariage.date) || f.mariage.date)}</span>` : "";
    return `<div class="union"><b>∞</b>${mar}</div>${carte(autre)}`;
  }).join("") + `</div></div>`;
  // enfants
  const avecEnfants = cj.filter(fid => (F[fid].enfants||[]).length);
  if (avecEnfants.length){
    h += `<div class="connecteur"></div><div class="rangee"><h3>Enfants</h3><div class="groupes">` + avecEnfants.map(fid => {
      const autre = (F[fid].parents||[]).find(x => x !== k);
      const lbl = avecEnfants.length > 1 ? `<div class="groupe-etiquette">avec ${autre ? esc(nom(autre)) : "parent inconnu"}</div>` : "";
      return `<div class="groupe">${lbl}${F[fid].enfants.map(e => carte(e)).join("")}</div>`;
    }).join("") + `</div></div>`;
  }
  const fr = fratrieDe(k);
  if (fr.length){
    h += `<div class="rangee" style="margin-top:28px"><h3>Frères et sœurs</h3><div class="groupes"><div class="groupe">${fr.map(e => carte(e)).join("")}</div></div></div>`;
  }
  h += `</div>${panneau(k)}</div>`;
  return h;
}

function evtLigne(lbl, e){
  if (!e) return "";
  const t = [fDate(e.date), e.lieu].filter(Boolean).join(" · ");
  return `<dt>${esc(lbl)}</dt><dd>${esc(t || "sans date")}${e.description ? ` — ${esc(e.description)}` : ""}</dd>`;
}
const TYPES = {diplome:"Diplôme", debut_couple:"Début du couple", fiancailles:"Fiançailles", divorce:"Divorce", autre_12:"Événement", bapteme:"Baptême", naissance:"Naissance", deces:"Décès"};
function panneau(k){
  const p = P[k];
  let h = `<aside class="panneau" aria-label="Fiche"><h2>${esc(nom(k))}</h2>`;
  if (PRIVE){
    const sous = [];
    if (p.autres_prenoms) sous.push("aussi " + esc(p.autres_prenoms));
    if (p._vivant === true) sous.push("vivant" + (fem(k) ? "e" : ""));
    if (p._vivant === false) sous.push("décédé" + (fem(k) ? "e" : ""));
    if (p._mineur) sous.push("mineur" + (fem(k) ? "e" : "") + " · masqué" + (fem(k) ? "e" : "") + " en public");
    h += `<p class="sous">${sous.join(" · ")}</p><dl>`;
    h += evtLigne(fem(k) ? "Née" : "Né", p.naissance) + evtLigne("Baptême", p.bapteme) + evtLigne(fem(k) ? "Décédée" : "Décédé", p.deces);
    (p.evenements||[]).forEach(e => h += evtLigne(TYPES[e.type] || e.type, e));
    unions[k].forEach(fid => {
      const f = F[fid], autre = (f.parents||[]).find(x => x !== k);
      if (f.mariage) h += evtLigne("Mariage" + (autre ? " avec " + nom(autre) : ""), f.mariage);
      (f.evenements||[]).forEach(e => h += evtLigne((TYPES[e.type]||e.type) + (autre ? " avec " + nom(autre) : ""), e));
    });
    if (!p.naissance && !p.deces && p._annee) h += `<dt>Naissance</dt><dd>vers ${p._annee} (estimation)</dd>`;
    h += `</dl>`;
    if ((p.etiquettes||[]).length) h += `<h4>Étiquettes</h4>` + p.etiquettes.map(t => `<span class="puce">${esc(t)}</span>`).join("");
    if ((p.notes||[]).length) h += `<h4>Notes</h4><ul>` + p.notes.map(n => `<li>${esc(n)}</li>`).join("") + `</ul>`;
    const meds = [...(p.medias||[]), ...unions[k].flatMap(fid => F[fid].medias||[])].filter((m,i,a) => M[m] && a.indexOf(m) === i);
    if (meds.length){
      h += `<h4>Documents</h4><div class="medias">` + meds.map(m => {
        const md = M[m];
        const img = md.miniature ? `<img src="${esc(md.miniature)}" alt="" loading="lazy">` : "";
        return md.fichier ? `<a href="${esc(md.fichier)}" target="_blank" rel="noopener">${img}${esc(md.titre||"Document")}</a>`
                          : `<a title="fichier manquant">${img}${esc(md.titre||"Document")} (manquant)</a>`;
      }).join("") + `</div>`;
    }
  } else {
    const n = [parentsDe[k].length && `${parentsDe[k].length} parent(s)`, conjointsDe(k).length && `${conjointsDe(k).length} conjoint(s)`, enfantsDe(k).length && `${enfantsDe(k).length} enfant(s)`].filter(Boolean);
    h += `<p class="sous">${n.join(" · ")}</p>`;
  }
  if (k !== DEPART && !masque(DEPART)){
    const l = lien(DEPART, k);
    h += `<div class="lienp">${esc(l.phrase)}</div>`;
  }
  h += `<h4>Explorer</h4><button class="btn" data-aller="ascendance" data-id="${k}">Ascendance</button> <button class="btn" data-aller="lien" data-id="${k}">Lien avec…</button>`;
  return h + `</aside>`;
}

/* ---------- vue Ascendance ---------- */
function vueAscendance(){
  const G = nbGen, W = 200, gap = 34, hDer = 44, vgap = 8;
  const slots = 2 ** (G-1), H = slots * (hDer + vgap);
  const cartes = [], lignes = [];
  function place(k, g, i){
    const n = 2 ** g, h = Math.min(hDer + 22, H / n - vgap), y = (i + .5) * (H / n) - h/2, x = g * (W + gap);
    const compact = h < 62 ? " compact" : "";
    cartes.push(`<div style="left:${x}px;top:${y}px;width:${W}px;height:${h}px;position:absolute">${carte(k, (g === 0 ? "centre" : "") + compact).replace('class="carte', 'style="width:100%;height:100%;min-width:0;max-width:none;padding:4px 10px" class="carte')}</div>`);
    if (!k || masque(k) || g === G-1) return {x, y, h};
    const par = parentsDe[k];
    const pe = par.find(x => P[x].sexe === "M") || null, me = par.find(x => P[x].sexe === "F") || null;
    if (!pe && !me) return {x, y, h};
    [pe, me].forEach((p, j) => {
      if (!p) return;
      const c = place(p, g+1, i*2+j);
      const x1 = x + W, y1 = y + h/2, x2 = c.x, y2 = c.y + c.h/2, xm = x1 + gap/2;
      lignes.push(`<path d="M${x1} ${y1} H${xm} V${y2} H${x2}" fill="none" stroke="var(--trait)" stroke-width="1.5"/>`);
    });
    return {x, y, h};
  }
  place(focus, 0, 0);
  const largeur = G * (W + gap) - gap;
  return `<div class="asc-outils"><span>Ascendance de <b>${esc(nom(focus))}</b></span>
    <label>Générations <select id="nbgen">${[3,4,5,6,7].map(n => `<option ${n===G?"selected":""}>${n}</option>`).join("")}</select></label>
    <span>Clique sur une personne pour remonter plus loin.</span></div>
    <div class="asc-cadre"><div class="asc" style="width:${largeur}px;height:${H}px"><svg width="${largeur}" height="${H}">${lignes.join("")}</svg>${cartes.join("")}</div></div>`;
}

/* ---------- vue Lien ---------- */
function vueLien(){
  let h = `<div class="lien-form"><div><label>Personne A</label><div class="recherche" id="ra"></div></div><div style="text-align:center;padding-bottom:8px">et</div><div><label>Personne B</label><div class="recherche" id="rb"></div></div></div><div class="lien-res">`;
  if (lienA && lienB){
    const l = lien(lienA, lienB);
    h += `<p class="lien-phrase">${esc(l.phrase)}</p>`;
    if (l.sang){
      const s = l.sang;
      const sommet = s.ancs.map(x => carte(x)).join("");
      const ch = c => c.slice(1).map(x => `<div class="connecteur"></div>${carte(x)}`).join("");
      h += `<div class="sommet"><h3 class="note" style="margin:0 0 6px">Ancêtre${s.ancs.length>1?"s":""} commun${s.ancs.length>1?"s":""}</h3><div class="groupe">${sommet}</div></div>`;
      if (s.a || s.b) h += `<div class="chemins">${s.a ? `<div class="chemin">${ch(s.cheminA)}</div>` : ""}${s.b ? `<div class="chemin">${ch(s.cheminB)}</div>` : ""}</div>`;
    }
  } else h += `<p class="note" style="text-align:center">Choisis deux personnes pour voir leur lien de parenté.</p>`;
  return h + `</div>`;
}

/* ---------- vue Index ---------- */
function vueIndex(){
  const nbMasques = Object.keys(P).filter(masque).length;
  return `<div class="idx-outils"><input id="filtre" type="search" placeholder="Filtrer par nom…" aria-label="Filtrer"><span class="note" id="compte"></span></div><div class="idx" id="idx"></div>
    ${nbMasques ? `<p class="note">${nbMasques} personne(s) mineure(s) ne sont pas listées dans cette version.</p>` : ""}`;
}
function remplirIndex(q){
  const t = norm(q).trim().split(/\s+/).filter(Boolean);
  const ks = Object.keys(P).filter(k => !masque(k) && t.every(x => norm(nom(k)).includes(x)));
  const par = {};
  ks.forEach(k => { const n = (P[k].nom || "—").trim(); (par[n] = par[n] || []).push(k); });
  const noms = Object.keys(par).sort((a,b) => a.localeCompare(b, "fr"));
  document.getElementById("compte").textContent = `${ks.length} personne(s), ${noms.length} nom(s) de famille`;
  document.getElementById("idx").innerHTML = noms.map(n => `<section><h3>${esc(n)} <small>${par[n].length}</small></h3>` +
    par[n].sort((a,b) => (P[a].prenom||"").localeCompare(P[b].prenom||"", "fr")).map(k => `<button data-id="${k}">${esc(P[k].prenom || "?")} <span class="an">${esc(annees(k))}</span></button>`).join("") + `</section>`).join("");
}

/* ---------- rendu ---------- */
function generations(k){ let g = 0, niv = [k]; while (niv.length){ g++; niv = niv.flatMap(x => parentsDe[x]); } return g; }
function rendre(){
  document.querySelectorAll("#nav button").forEach(b => b.setAttribute("aria-current", b.dataset.vue === vue));
  const c = document.getElementById("contenu");
  c.innerHTML = vue === "famille" ? vueFamille() : vue === "ascendance" ? vueAscendance() : vue === "lien" ? vueLien() : vueIndex();
  if (vue === "lien"){
    champRecherche("ra", "Rechercher une personne…", k => aller("lien", k, lienB), lienA ? nom(lienA) : "");
    champRecherche("rb", "Rechercher une personne…", k => aller("lien", lienA, k), lienB ? nom(lienB) : "");
  }
  if (vue === "index"){ const f = document.getElementById("filtre"); f.addEventListener("input", () => remplirIndex(f.value)); remplirIndex(""); }
  if (vue === "ascendance") document.getElementById("nbgen").addEventListener("change", e => { nbGen = +e.target.value; rendre(); });
  document.title = (vue === "famille" || vue === "ascendance" ? nom(focus) + " · " : "") + ARBRE.meta.titre;
}
document.getElementById("contenu").addEventListener("click", e => {
  const al = e.target.closest("[data-aller]");
  if (al){ return al.dataset.aller === "lien" ? aller("lien", DEPART !== al.dataset.id && !masque(DEPART) ? DEPART : al.dataset.id, DEPART !== al.dataset.id && !masque(DEPART) ? al.dataset.id : null) : aller(al.dataset.aller, al.dataset.id); }
  const b = e.target.closest("[data-id]");
  if (b && !e.target.closest(".recherche")) aller(vue === "ascendance" ? "ascendance" : "famille", b.dataset.id);
});
document.getElementById("nav").addEventListener("click", e => { const b = e.target.closest("button"); if (b) aller(b.dataset.vue, b.dataset.vue === "lien" ? lienA : (b.dataset.vue === "index" ? null : focus), b.dataset.vue === "lien" ? lienB : null); });
const accueil = () => aller("famille", DEPART);
document.getElementById("titre").addEventListener("click", accueil);
document.getElementById("titre").addEventListener("keydown", e => { if (e.key === "Enter") accueil(); });

document.getElementById("titre-txt").textContent = ARBRE.meta.titre;
document.getElementById("sous-titre").textContent = `${Object.keys(P).length} personnes · ${generations(DEPART)} générations`;
if (PRIVE) document.getElementById("banniere").innerHTML = `<div class="prive-banniere">Version privée : contient des dates et des documents. Ne pas publier.</div>`;
document.getElementById("pied").innerHTML = PRIVE ? "Version privée complète" : "Version publique : noms et liens de parenté seulement. Les noms des personnes mineures sont masqués.";
champRecherche("recherche-entete", "Rechercher une personne…", k => aller(vue === "ascendance" ? "ascendance" : "famille", k));
lireHash(); rendre();
})();
</script>
